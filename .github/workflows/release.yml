# 手动发布（workflow_dispatch）：
#   1. npm version 修改 package.json 版本并打 vX.Y.Z tag
#   2. 推送 main 分支与 tag
#   3. 跑单元测试
#   4. npm publish（provenance）
#   5. 用 --generate-notes 创建 GitHub Release
#
# 前提：仓库 Secrets 中配置 NPM_TOKEN（npm automation token 或带 publish 权限的 granular token）。

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本增量：patch | minor | major；或直接写完整版本号，如 0.2.0'
        required: true
        default: patch

permissions:
  contents: write # push main + tag、创建 GitHub Release
  id-token: write # npm publish provenance（npmjs 公开包）

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Bump version and create tag
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "${{ inputs.bump }}" -m 'chore: release v%s'
          echo "tag=v$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push main and tag
        run: |
          git push origin main
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
