# push 之后自动跑一次单元测试（npm test）：
#   触发：任何分支的 push（branches: '**' —— 不含发版时的 tag push，避免重复跑）。
#   与 release.yml 保持一致：Node 22 + npm install --no-audit --no-fund。
#   同一 ref 的连续 push 只保留最新一次运行（cancel-in-progress）。
#   只跑纯单元测试；需要真机凭据的 test:integration 不进 CI。

name: test

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test
